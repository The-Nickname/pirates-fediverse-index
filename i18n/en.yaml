  minas_gerais-discord:
    extendedDescription: Welcome to the OSM Minas Gerais Discord! We’re a community of mappers passionate about building detailed, open-source maps for Minas Gerais, Brazil. Join us to collaborate, share tips, and help make MG’s maps the best on OpenStreetMap. Whether you’re a newbie or a pro, let’s map together!
  OSM-AR-geolibres:
    name: GeoLibres
    description: Geolibres Civil Association
    extendedDescription: We promote the creation and use of free access geographic data, the adoption of geographic standards, and the use of free and open source software.
  OSM-AR-telegram:
    extendedDescription: This is the most active channel in the community, ideal for chatting and getting answers to your questions instantly. Everyone is welcome!
  OSM-AR-twitter:
    extendedDescription: News from the local community and OpenStreetMap in general.
  OSM-AR-wiki:
    description: Everything you need to know about mapping in Argentina.
  osm-de:
